name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read validated release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py metadata --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mod-distribution
          path: dist
      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          # Upload into a draft so a partially uploaded release is never public.
          gh release create "$RELEASE_TAG" dist/*.jar dist/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TITLE" \
            --notes-file dist/release-notes.md "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
