[Service]
# Expose only the installed mod directories inside the service's private mount namespace.
BindReadOnlyPaths=/srv/minecraft/mc/mods:/run/minecraft-mod-stager-sources/mc-server
BindReadOnlyPaths=/srv/minecraft/cmc/mods:/run/minecraft-mod-stager-sources/cmc-server
BindReadOnlyPaths=/srv/minecraft/mc/automodpack/host-modpack/main/mods:/run/minecraft-mod-stager-sources/mc-client
